name: Build and Push Custom OnlyOffice DocumentServer

on:
  workflow_dispatch:
    inputs:
      onlyoffice_version:
        description: 'OnlyOffice build_tools Git Tag (e.g., v10.0.1.11)'
        required: true
        default: 'v10.0.1.11'
        type: string
  schedule:
    # Optional: Run monthly on the 1st at 02:00 UTC
    - cron: '0 2 1 * *'

env:
  ONLYOFFICE_VERSION: ${{ github.event.inputs.onlyoffice_version || 'v10.0.1.11' }}
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/onlyoffice-documentserver
  PLATFORM: linux/amd64

jobs:
  build-and-push:
    name: Build OnlyOffice (${{ github.event.inputs.onlyoffice_version || 'v10.0.1.11' }}) for linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space (Cleanup pre-installed packages)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/* \
            /usr/local/share/boost \
            /usr/local/graalvm \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/lib/jvm \
            /usr/lib/google-cloud-sdk \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /opt/az \
            /usr/share/az_* \
            /opt/microsoft \
            /usr/local/sqlpackage \
            /usr/lib/llvm-* \
            /usr/local/julia* \
            /usr/share/rust \
            /usr/share/sbt \
            /usr/share/gradle* \
            /usr/share/maven* \
            /usr/local/lib/node_modules
          sudo rm -f /usr/local/bin/grunt /usr/local/bin/pkg /usr/local/bin/yarn /usr/local/bin/corepack /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/node
          sudo docker image prune --all --force || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Configure Swap Space (4 GB for C++/V8 Compilation)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Install Base Build Prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python-is-python3 \
            git \
            curl \
            wget \
            build-essential \
            sudo \
            ca-certificates

      - name: Clone ONLYOFFICE/build_tools (${{ env.ONLYOFFICE_VERSION }})
        run: |
          git clone --depth 1 --branch "${ONLYOFFICE_VERSION}" https://github.com/ONLYOFFICE/build_tools.git build_tools

      - name: Fetch Sub-Repositories (core, server, sdkjs, web-apps) & Hook Patch + Disk-Cleanup Scripts
        run: |
          chmod +x "${GITHUB_WORKSPACE}/scripts/patch-limits.sh"
          
          # Inject hooks into build_tools/make.py and build_tools/scripts/build_sln.py:
          # 1. Right after base.update_repositories(repositories): run scripts/patch-limits.sh
          # 2. Right after make_common.make(): delete ~18 GB of intermediate V8/Boost/CEF/ICU build objects
          #    while keeping libv8_monolith.a, icudtl.dat, and headers needed for linking core.
          # 3. Inside build_sln.py after each qmake.make(): remove intermediate core_build .o files.
          # 4. Right after build_sln.make(): delete static .a archives & 3rdParty build dirs before JS/Server packaging.
          python3 - << 'EOF'
          import os, sys

          make_py_path = os.path.join("build_tools", "make.py")
          with open(make_py_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Hook 1: patch-limits.sh after update_repositories
          target_update = "base.update_repositories(repositories)"
          if target_update not in content:
              print("ERROR: Could not locate 'base.update_repositories(repositories)' in build_tools/make.py", file=sys.stderr)
              sys.exit(1)

          patch_hook = (
              f"{target_update}\n"
              f"  print('=== Executing custom patch-limits.sh hook ===')\n"
              f"  if os.system(os.environ['GITHUB_WORKSPACE'] + '/scripts/patch-limits.sh ' + os.path.abspath('.')) != 0:\n"
              f"    raise RuntimeError('patch-limits.sh failed!')"
          )
          content = content.replace(target_update, patch_hook, 1)

          # Hook 2: Post-make_common.make() disk cleanup (~18 GB V8 & 3rdParty intermediate objects)
          target_common = "make_common.make()"
          if target_common not in content:
              print("ERROR: Could not locate 'make_common.make()' in build_tools/make.py", file=sys.stderr)
              sys.exit(1)

          common_cleanup_cmd = (
              "set -e; "
              "CORE_3DP='../core/Common/3dParty'; "
              "if [ -d \"$CORE_3DP/v8_89/v8/out.gn/linux_64/obj\" ]; then "
              "  if [ -f \"$CORE_3DP/v8_89/v8/out.gn/linux_64/obj/libv8_monolith.a\" ]; then "
              "    mv \"$CORE_3DP/v8_89/v8/out.gn/linux_64/obj/libv8_monolith.a\" /tmp/libv8_monolith.a; "
              "    rm -rf \"$CORE_3DP/v8_89/v8/out.gn/linux_64/obj\"/*; "
              "    mv /tmp/libv8_monolith.a \"$CORE_3DP/v8_89/v8/out.gn/linux_64/obj/libv8_monolith.a\"; "
              "  fi; "
              "  rm -rf \"$CORE_3DP/v8_89/v8/out.gn/linux_64/gen\" "
              "         \"$CORE_3DP/v8_89/depot_tools\" "
              "         \"$CORE_3DP/v8_89/v8/.git\" "
              "         \"$CORE_3DP/v8_89/v8/third_party\" "
              "         \"$CORE_3DP/v8_89/v8/third_party_new\" "
              "         \"$CORE_3DP/v8_89/v8/test\" "
              "         \"$CORE_3DP/v8_89/v8/tools\"; "
              "fi; "
              "rm -rf \"$CORE_3DP/boost/boost_1_72_0/bin.v2\" \"$CORE_3DP/boost/boost_1_72_0/.git\"; "
              "rm -f \"$CORE_3DP/cef/linux_64/cef_binary.7z\"; "
              "find \"$CORE_3DP/icu\" -name '*.o' -delete 2>/dev/null || true; "
              "find \"$CORE_3DP/openssl\" -name '*.o' -delete 2>/dev/null || true; "
              "df -h"
          )
          common_cleanup_hook = (
              f"{target_common}\n"
              f"print('=== Cleaning intermediate 3dParty build artifacts (V8, Boost, CEF, ICU) to free disk space ===')\n"
              f"os.system({common_cleanup_cmd!r})"
          )
          content = content.replace(target_common, common_cleanup_hook, 1)

          # Hook 4: Post-build_sln.make() cleanup
          target_sln = "build_sln.make()"
          if target_sln not in content:
              print("ERROR: Could not locate 'build_sln.make()' in build_tools/make.py", file=sys.stderr)
              sys.exit(1)

          sln_cleanup_cmd = (
              "rm -f ../core/Common/3dParty/v8_89/v8/out.gn/linux_64/obj/libv8_monolith.a; "
              "rm -rf ../core/Common/3dParty/cef ../core/Common/3dParty/boost; "
              "rm -f ../core/build/lib/linux_64/*.a; "
              "df -h"
          )
          sln_cleanup_hook = (
              f"{target_sln}\n"
              f"print('=== Cleaning post-C++ static archives and 3dParty dirs before JS/Server build ===')\n"
              f"os.system({sln_cleanup_cmd!r})"
          )
          content = content.replace(target_sln, sln_cleanup_hook, 1)

          with open(make_py_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Successfully injected patch and disk-cleanup hooks into build_tools/make.py")

          # Hook 3: Per-project core_build object cleanup in build_tools/scripts/build_sln.py
          build_sln_path = os.path.join("build_tools", "scripts", "build_sln.py")
          with open(build_sln_path, "r", encoding="utf-8") as f:
              sln_content = f.read()

          target_qmake = "qmake.make(platform, pro, qmake_main_addon)"
          if target_qmake not in sln_content:
              print("ERROR: Could not locate qmake.make call in build_tools/scripts/build_sln.py", file=sys.stderr)
              sys.exit(1)

          qmake_cleanup = (
              f"{target_qmake}\n"
              f"      os.system('find ../core -type d -name \"core_build\" -prune -exec rm -rf {{}} + 2>/dev/null || true')"
          )
          sln_content = sln_content.replace(target_qmake, qmake_cleanup, 1)
          with open(build_sln_path, "w", encoding="utf-8") as f:
              f.write(sln_content)
          print("Successfully injected per-project core_build cleanup into build_tools/scripts/build_sln.py")
          EOF

      - name: Compile Server Components (./automate.py server)
        run: |
          cd build_tools/tools/linux
          # If ONLYOFFICE_VERSION is a tag (starts with 'v'), build_tools expects 'tags/<version>'
          # so that scripts/base.py skips running 'git pull' on a detached HEAD.
          if [[ "${ONLYOFFICE_VERSION}" == "master" ]]; then
            BUILD_BRANCH="master"
          elif [[ "${ONLYOFFICE_VERSION}" == tags/* ]]; then
            BUILD_BRANCH="${ONLYOFFICE_VERSION}"
          else
            BUILD_BRANCH="tags/${ONLYOFFICE_VERSION}"
          fi
          echo "=== Running automate.py with --branch=${BUILD_BRANCH} ==="
          ./automate.py server --branch="${BUILD_BRANCH}"
          
          echo "=== Verifying build output in build_tools/out/linux_64/onlyoffice/documentserver ==="
          ls -la "${GITHUB_WORKSPACE}/build_tools/out/linux_64/onlyoffice/documentserver"

      - name: Clean Intermediate Build Sources to Reclaim Disk Space
        run: |
          echo "=== Reclaiming disk space before Docker build ==="
          rm -rf "${GITHUB_WORKSPACE}/build_tools/core" \
                 "${GITHUB_WORKSPACE}/build_tools/sdkjs" \
                 "${GITHUB_WORKSPACE}/build_tools/web-apps" \
                 "${GITHUB_WORKSPACE}/build_tools/server" \
                 "${GITHUB_WORKSPACE}/core" \
                 "${GITHUB_WORKSPACE}/sdkjs" \
                 "${GITHUB_WORKSPACE}/web-apps" \
                 "${GITHUB_WORKSPACE}/server" \
                 "${GITHUB_WORKSPACE}/dictionaries" \
                 "${GITHUB_WORKSPACE}/core-fonts" \
                 "${GITHUB_WORKSPACE}/document-templates" \
                 "${GITHUB_WORKSPACE}/onlyoffice.github.io" \
                 "${GITHUB_WORKSPACE}/build_tools/out/js"
          df -h

      - name: Merge Built Artifacts with ONLYOFFICE/Docker-DocumentServer
        run: |
          git clone --depth 1 --branch "${ONLYOFFICE_VERSION}" https://github.com/ONLYOFFICE/Docker-DocumentServer.git Docker-DocumentServer || \
          git clone --depth 1 https://github.com/ONLYOFFICE/Docker-DocumentServer.git Docker-DocumentServer

          # Move compiled server artifacts into Docker build context
          mv "${GITHUB_WORKSPACE}/build_tools/out/linux_64/onlyoffice/documentserver" \
             "${GITHUB_WORKSPACE}/Docker-DocumentServer/documentserver-compiled"

          # Append overlay steps to official Dockerfile:
          # The official Dockerfile sets up OS dependencies, Nginx, Supervisor, user 'ds', and base directories.
          # We then overwrite /var/www/onlyoffice/documentserver/ with our freshly compiled & patched artifacts.
          cat << 'DOCKERFILE_EOF' >> "${GITHUB_WORKSPACE}/Docker-DocumentServer/Dockerfile"

          # --- Overlay Custom Compiled & Patched OnlyOffice DocumentServer Artifacts ---
          COPY documentserver-compiled/ /var/www/onlyoffice/documentserver/
          RUN chown -R ds:ds /var/www/onlyoffice/documentserver && \
              chmod +x /var/www/onlyoffice/documentserver/server/FileConverter/bin/x2t && \
              chmod +x /var/www/onlyoffice/documentserver/server/tools/allfontsgen && \
              chmod +x /var/www/onlyoffice/documentserver/server/tools/allthemesgen
          DOCKERFILE_EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./Docker-DocumentServer
          file: ./Docker-DocumentServer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/onlyoffice-documentserver:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/onlyoffice-documentserver:${{ env.ONLYOFFICE_VERSION }}
