name: Build and Push Custom OnlyOffice DocumentServer

on:
  workflow_dispatch:
    inputs:
      onlyoffice_version:
        description: 'OnlyOffice Release Git Tag matching build_tools & server (e.g., v10.0.0.169)'
        required: true
        default: 'v10.0.0.169'
        type: string
      platforms:
        description: 'Target architecture(s) to build and push'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
  schedule:
    # Optional: Run monthly on the 1st at 02:00 UTC
    - cron: '0 2 1 * *'

env:
  ONLYOFFICE_VERSION: ${{ github.event.inputs.onlyoffice_version || 'v10.0.0.169' }}
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/onlyoffice-documentserver

jobs:
  build:
    name: Build OnlyOffice (${{ github.event.inputs.onlyoffice_version || 'v10.0.0.169' }}) [${{ matrix.arch }}]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ (github.event.inputs.platforms == 'linux/amd64' && fromJSON('["amd64"]')) || (github.event.inputs.platforms == 'linux/arm64' && fromJSON('["arm64"]')) || fromJSON('["amd64", "arm64"]') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space (Cleanup pre-installed packages)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/* \
            /usr/local/share/boost \
            /usr/local/graalvm \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/lib/jvm \
            /usr/lib/google-cloud-sdk \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /opt/az \
            /usr/share/az_* \
            /opt/microsoft \
            /usr/local/sqlpackage \
            /usr/lib/llvm-* \
            /usr/local/julia* \
            /usr/share/rust \
            /usr/share/sbt \
            /usr/share/gradle* \
            /usr/share/maven* \
            /usr/local/lib/node_modules
          sudo rm -f /usr/local/bin/grunt /usr/local/bin/pkg /usr/local/bin/yarn /usr/local/bin/corepack /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/node
          sudo docker image prune --all --force || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Configure Swap Space (4 GB for C++/V8 Compilation)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Install Base Build Prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python-is-python3 \
            git \
            curl \
            wget \
            build-essential \
            binutils-aarch64-linux-gnu \
            sudo \
            ca-certificates

      - name: Clone ONLYOFFICE/build_tools (${{ env.ONLYOFFICE_VERSION }})
        run: |
          git clone --depth 1 --branch "${ONLYOFFICE_VERSION}" https://github.com/ONLYOFFICE/build_tools.git build_tools

      - name: Fetch Sub-Repositories (core, server, sdkjs, web-apps) & Hook Patch + Disk-Cleanup Scripts
        env:
          QT_SYSROOT_TARGET: ${{ matrix.arch == 'arm64' && 'all' || 'amd64' }}
        run: |
          chmod +x "${GITHUB_WORKSPACE}/scripts/patch-limits.sh"
          
          # Inject hooks into build_tools/make.py and build_tools/scripts/build_sln.py:
          # 1. Right after base.update_repositories(repositories): run scripts/patch-limits.sh
          # 2. Right after make_common.make(): delete ~18 GB of intermediate V8/Boost/CEF/ICU build objects
          #    while keeping libv8_monolith.a, icudtl.dat, and headers needed for linking core.
          # 3. Inside build_sln.py after each qmake.make(): remove intermediate core_build .o files.
          # 4. Right after build_sln.make(): delete static .a archives & 3rdParty build dirs before JS/Server packaging.
          python3 - << 'EOF'
          import os, sys

          make_py_path = os.path.join("build_tools", "make.py")
          with open(make_py_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Hook 1: patch-limits.sh after update_repositories
          target_update = "base.update_repositories(repositories)"
          if target_update not in content:
              print("ERROR: Could not locate 'base.update_repositories(repositories)' in build_tools/make.py", file=sys.stderr)
              sys.exit(1)

          patch_hook = (
              f"{target_update}\n"
              f"  print('=== Executing custom patch-limits.sh hook ===')\n"
              f"  if os.system(os.environ['GITHUB_WORKSPACE'] + '/scripts/patch-limits.sh ' + os.path.abspath('.')) != 0:\n"
              f"    raise RuntimeError('patch-limits.sh failed!')"
          )
          content = content.replace(target_update, patch_hook, 1)

          # Hook 2: Post-make_common.make() disk cleanup (~18 GB V8 & 3rdParty intermediate objects)
          target_common = "make_common.make()"
          if target_common not in content:
              print("ERROR: Could not locate 'make_common.make()' in build_tools/make.py", file=sys.stderr)
              sys.exit(1)

          common_cleanup_cmd = (
              "set -e; "
              "CORE_3DP='../core/Common/3dParty'; "
              "for PLAT in linux_64 linux_arm64; do "
              "  if [ -d \"$CORE_3DP/v8_89/v8/out.gn/$PLAT/obj\" ]; then "
              "    if [ -f \"$CORE_3DP/v8_89/v8/out.gn/$PLAT/obj/libv8_monolith.a\" ]; then "
              "      mv \"$CORE_3DP/v8_89/v8/out.gn/$PLAT/obj/libv8_monolith.a\" \"/tmp/libv8_monolith_${PLAT}.a\"; "
              "      rm -rf \"$CORE_3DP/v8_89/v8/out.gn/$PLAT/obj\"/*; "
              "      mv \"/tmp/libv8_monolith_${PLAT}.a\" \"$CORE_3DP/v8_89/v8/out.gn/$PLAT/obj/libv8_monolith.a\"; "
              "    fi; "
              "    rm -rf \"$CORE_3DP/v8_89/v8/out.gn/$PLAT/gen\"; "
              "  fi; "
              "done; "
              "if [ -d \"$CORE_3DP/v8_89/v8\" ]; then "
              "  rm -rf \"$CORE_3DP/v8_89/depot_tools\" "
              "         \"$CORE_3DP/v8_89/v8/.git\" "
              "         \"$CORE_3DP/v8_89/v8/third_party\" "
              "         \"$CORE_3DP/v8_89/v8/third_party_new\" "
              "         \"$CORE_3DP/v8_89/v8/test\" "
              "         \"$CORE_3DP/v8_89/v8/tools\"; "
              "fi; "
              "rm -rf \"$CORE_3DP/boost/boost_1_72_0/bin.v2\" \"$CORE_3DP/boost/boost_1_72_0/.git\"; "
              "rm -f \"$CORE_3DP\"/cef/*/cef_binary.7z; "
              "find \"$CORE_3DP/icu\" -name '*.o' -delete 2>/dev/null || true; "
              "find \"$CORE_3DP/openssl\" -name '*.o' -delete 2>/dev/null || true; "
              "df -h"
          )
          common_cleanup_hook = (
              f"{target_common}\n"
              f"print('=== Cleaning intermediate 3dParty build artifacts (V8, Boost, CEF, ICU) to free disk space ===')\n"
              f"os.system({common_cleanup_cmd!r})"
          )
          content = content.replace(target_common, common_cleanup_hook, 1)

          # Hook 4: Post-build_sln.make() cleanup
          target_sln = "build_sln.make()"
          if target_sln not in content:
              print("ERROR: Could not locate 'build_sln.make()' in build_tools/make.py", file=sys.stderr)
              sys.exit(1)

          sln_cleanup_cmd = (
              "rm -f ../core/Common/3dParty/v8_89/v8/out.gn/*/obj/libv8_monolith.a; "
              "rm -rf ../core/Common/3dParty/cef ../core/Common/3dParty/boost; "
              "rm -f ../core/build/lib/*/*.a; "
              "df -h"
          )
          sln_cleanup_hook = (
              f"{target_sln}\n"
              f"print('=== Cleaning post-C++ static archives and 3dParty dirs before JS/Server build ===')\n"
              f"os.system({sln_cleanup_cmd!r})"
          )
          content = content.replace(target_sln, sln_cleanup_hook, 1)

          with open(make_py_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Successfully injected patch and disk-cleanup hooks into build_tools/make.py")

          # Hook 3: Per-project core_build object cleanup in build_tools/scripts/build_sln.py
          build_sln_path = os.path.join("build_tools", "scripts", "build_sln.py")
          with open(build_sln_path, "r", encoding="utf-8") as f:
              sln_content = f.read()

          target_qmake = "qmake.make(platform, pro, qmake_main_addon)"
          if target_qmake not in sln_content:
              print("ERROR: Could not locate qmake.make call in build_tools/scripts/build_sln.py", file=sys.stderr)
              sys.exit(1)

          qmake_cleanup = (
              f"{target_qmake}\n"
              f"      os.system('find ../core -type d -name \"core_build\" -prune -exec rm -rf {{}} + 2>/dev/null || true')"
          )
          sln_content = sln_content.replace(target_qmake, qmake_cleanup, 1)
          with open(build_sln_path, "w", encoding="utf-8") as f:
              f.write(sln_content)
          print("Successfully injected per-project core_build cleanup into build_tools/scripts/build_sln.py")

          # Hook 5: Configure automate.py Qt and sysroot downloads ('amd64' for x86_64 builds,
          # 'all' for arm64 cross-compilation because x86_64 host qmake/gcc cross-tools + arm64 target libs are both needed)
          # and delete downloaded .7z / .tar.gz archives immediately after extraction (~6 GB saved)
          qt_sysroot_target = os.environ.get("QT_SYSROOT_TARGET", "all")
          automate_path = os.path.join("build_tools", "tools", "linux", "automate.py")
          if os.path.isfile(automate_path):
              with open(automate_path, "r", encoding="utf-8") as f:
                  auto_content = f.read()
              auto_content = auto_content.replace('["./qt_binary_fetch.py", "all"]', f'["./qt_binary_fetch.py", "{qt_sysroot_target}"]')
              auto_content = auto_content.replace('["./fetch.py", "all"]', f'["./fetch.py", "{qt_sysroot_target}"]')
              with open(automate_path, "w", encoding="utf-8") as f:
                  f.write(auto_content)
              print(f"Configured automate.py qt_binary_fetch and sysroot fetch target: {qt_sysroot_target}")

          for fetch_script in [
              os.path.join("build_tools", "tools", "linux", "qt_binary_fetch.py"),
              os.path.join("build_tools", "tools", "linux", "sysroot", "fetch.py"),
          ]:
              if os.path.isfile(fetch_script):
                  with open(fetch_script, "r", encoding="utf-8") as f:
                      fc = f.read()
                  if 'base.extract(archive_file, "./")' in fc:
                      fc = fc.replace(
                          'base.extract(archive_file, "./")',
                          'base.extract(archive_file, "./")\n  base.delete_file(archive_file)'
                      )
                  if 'base.cmd("tar", ["-xzf", "./" + archive])' in fc:
                      fc = fc.replace(
                          'base.cmd("tar", ["-xzf", "./" + archive])',
                          'base.cmd("tar", ["-xzf", "./" + archive])\n  base.delete_file("./" + archive)'
                      )
                  with open(fetch_script, "w", encoding="utf-8") as f:
                      f.write(fc)

          # Hook 6: Use shallow clones (--depth 1) in build_tools/scripts/base.py git_update()
          # Saves ~8-10 minutes of cloning and ~8-10 GB of .git packfiles!
          base_py_path = os.path.join("build_tools", "scripts", "base.py")
          with open(base_py_path, "r", encoding="utf-8") as f:
              base_content = f.read()
          old_clone = 'retClone = cmd("git", ["clone", url, folder], is_no_errors)'
          new_clone = (
              'branch_tag = config.option("branch").replace("tags/", "")\n'
              '    retClone = cmd("git", ["clone", "--depth", "1", "--branch", branch_tag, url, folder], True) if branch_tag else 1\n'
              '    if retClone != 0:\n'
              '      retClone = cmd("git", ["clone", "--depth", "1", url, folder], is_no_errors)'
          )
          if old_clone in base_content:
              base_content = base_content.replace(old_clone, new_clone, 1)
              with open(base_py_path, "w", encoding="utf-8") as f:
                  f.write(base_content)
              print("Enabled shallow --depth 1 git clones in build_tools/scripts/base.py")

          # Hook 7: Backport upstream OnlyOffice v8_89.py fix ("Fix build") for depot_tools Python 3 bootstrap on Linux
          v8_89_path = os.path.join("build_tools", "scripts", "core_common", "modules", "v8_89.py")
          with open(v8_89_path, "r", encoding="utf-8") as f:
              v8_content = f.read()
          v8_content = v8_content.replace(
              'if ("mac" == base.host_platform()):\n    base.set_env("DEPOT_TOOLS_BOOTSTRAP_PYTHON3", "0")',
              'if ("windows" != base.host_platform()):\n    base.set_env("DEPOT_TOOLS_BOOTSTRAP_PYTHON3", "0")'
          )
          v8_content = v8_content.replace(
              '    if ("linux" == base.host_platform()):\n'
              '      if not base.is_file("./depot_tools/python3_bin_reldir.txt"):\n'
              '        base.cmd_in_dir("./depot_tools", "./ensure_bootstrap", [], True)\n',
              ''
          )
          if 'if ("windows" != base.host_platform()):\n    base.set_env("DEPOT_TOOLS_BOOTSTRAP_PYTHON3", "0")' not in v8_content or "ensure_bootstrap" in v8_content:
              print("ERROR: Failed to apply depot_tools bootstrap fix to v8_89.py", file=sys.stderr)
              sys.exit(1)
          with open(v8_89_path, "w", encoding="utf-8") as f:
              f.write(v8_content)
          print("Patched build_tools/scripts/core_common/modules/v8_89.py (DEPOT_TOOLS_BOOTSTRAP_PYTHON3=0 on Linux)")

          # Hook 8: Pass --no-bytecode --public-packages "*" --public to pkg in build_tools/scripts/build_server.py
          # Prevents pkg from failing to generate V8 bytecode when cross-packaging node20-linux-arm64 on an x86_64 runner,
          # which otherwise strips private .js sources and causes MODULE_NOT_FOUND at startup on aarch64.
          build_server_path = os.path.join("build_tools", "scripts", "build_server.py")
          with open(build_server_path, "r", encoding="utf-8") as f:
              bs_content = f.read()
          old_pkg = '[".", "-t", pkg_target'
          new_pkg = '[".", "--no-bytecode", "--public-packages", "*", "--public", "-t", pkg_target'
          if old_pkg not in bs_content:
              print("ERROR: Could not locate pkg invocation pattern in build_tools/scripts/build_server.py", file=sys.stderr)
              sys.exit(1)
          bs_content = bs_content.replace(old_pkg, new_pkg)
          with open(build_server_path, "w", encoding="utf-8") as f:
              f.write(bs_content)
          print("Patched build_tools/scripts/build_server.py (--no-bytecode --public-packages '*' --public for pkg)")
          EOF

      - name: Compile Server Components (./automate.py server)
        env:
          OO_PLATFORM: ${{ matrix.arch == 'arm64' && 'linux_arm64' || 'linux_64' }}
        run: |
          cd build_tools/tools/linux
          # Derive PRODUCT_VERSION (e.g. 10.0.0) and BUILD_NUMBER (e.g. 169) from ONLYOFFICE_VERSION (v10.0.0.169)
          # as done in btactic's onlyoffice-package-builder.sh so build_server.py stamps the real version
          # into Common/sources/commondefines.js instead of 0.0.0.
          CLEAN_VER="${ONLYOFFICE_VERSION#tags/}"
          CLEAN_VER="${CLEAN_VER#v}"
          if [[ "${CLEAN_VER}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            export PRODUCT_VERSION="${BASH_REMATCH[1]}"
            export BUILD_NUMBER="${BASH_REMATCH[2]}"
          else
            export PRODUCT_VERSION="${CLEAN_VER}"
            export BUILD_NUMBER="1"
          fi
          export NODE_ENV="production"
          export DEPOT_TOOLS_BOOTSTRAP_PYTHON3="0"
          echo "=== Exported PRODUCT_VERSION=${PRODUCT_VERSION}, BUILD_NUMBER=${BUILD_NUMBER}, NODE_ENV=${NODE_ENV}, DEPOT_TOOLS_BOOTSTRAP_PYTHON3=${DEPOT_TOOLS_BOOTSTRAP_PYTHON3}, OO_PLATFORM=${OO_PLATFORM} ==="

          # If ONLYOFFICE_VERSION is a tag (starts with 'v'), build_tools expects 'tags/<version>'
          # so that scripts/base.py skips running 'git pull' on a detached HEAD.
          if [[ "${ONLYOFFICE_VERSION}" == "master" ]]; then
            BUILD_BRANCH="master"
          elif [[ "${ONLYOFFICE_VERSION}" == tags/* ]]; then
            BUILD_BRANCH="${ONLYOFFICE_VERSION}"
          else
            BUILD_BRANCH="tags/${ONLYOFFICE_VERSION}"
          fi
          echo "=== Running automate.py with --branch=${BUILD_BRANCH} --platform=${OO_PLATFORM} ==="
          ./automate.py server --branch="${BUILD_BRANCH}" --platform="${OO_PLATFORM}" --update-light="1"
          
          echo "=== Verifying build output in build_tools/out/${OO_PLATFORM}/onlyoffice/documentserver ==="
          ls -la "${GITHUB_WORKSPACE}/build_tools/out/${OO_PLATFORM}/onlyoffice/documentserver"

      - name: Clean Intermediate Build Sources to Reclaim Disk Space
        run: |
          echo "=== Reclaiming disk space before Docker build ==="
          rm -rf "${GITHUB_WORKSPACE}/build_tools/core" \
                 "${GITHUB_WORKSPACE}/build_tools/sdkjs" \
                 "${GITHUB_WORKSPACE}/build_tools/web-apps" \
                 "${GITHUB_WORKSPACE}/build_tools/server" \
                 "${GITHUB_WORKSPACE}/core" \
                 "${GITHUB_WORKSPACE}/sdkjs" \
                 "${GITHUB_WORKSPACE}/web-apps" \
                 "${GITHUB_WORKSPACE}/server" \
                 "${GITHUB_WORKSPACE}/dictionaries" \
                 "${GITHUB_WORKSPACE}/core-fonts" \
                 "${GITHUB_WORKSPACE}/document-templates" \
                 "${GITHUB_WORKSPACE}/onlyoffice.github.io" \
                 "${GITHUB_WORKSPACE}/build_tools/out/js"
          df -h

      - name: Merge Built Artifacts with ONLYOFFICE/Docker-DocumentServer
        env:
          OO_PLATFORM: ${{ matrix.arch == 'arm64' && 'linux_arm64' || 'linux_64' }}
          STRIP_BIN: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-strip' || 'strip' }}
        run: |
          git clone --depth 1 --branch "${ONLYOFFICE_VERSION}" https://github.com/ONLYOFFICE/Docker-DocumentServer.git Docker-DocumentServer || \
          git clone --depth 1 https://github.com/ONLYOFFICE/Docker-DocumentServer.git Docker-DocumentServer

          # Move compiled server artifacts into Docker build context
          mv "${GITHUB_WORKSPACE}/build_tools/out/${OO_PLATFORM}/onlyoffice/documentserver" \
             "${GITHUB_WORKSPACE}/Docker-DocumentServer/documentserver-compiled"

          # Strip debug symbols ONLY from pure C++ ELF binaries and shared libraries (not pkg Node.js executables)
          echo "=== Stripping debug symbols from C++ binaries and shared libraries (${STRIP_BIN}) ==="
          du -sh "${GITHUB_WORKSPACE}/Docker-DocumentServer/documentserver-compiled"
          "${STRIP_BIN}" --strip-unneeded \
            "${GITHUB_WORKSPACE}/Docker-DocumentServer/documentserver-compiled/server/FileConverter/bin/x2t" \
            "${GITHUB_WORKSPACE}/Docker-DocumentServer/documentserver-compiled/server/tools/allfontsgen" \
            "${GITHUB_WORKSPACE}/Docker-DocumentServer/documentserver-compiled/server/tools/allthemesgen" || true
          find "${GITHUB_WORKSPACE}/Docker-DocumentServer/documentserver-compiled/server/FileConverter/bin" \
            -maxdepth 1 -type f -name "*.so*" -exec "${STRIP_BIN}" --strip-unneeded {} + || true
          du -sh "${GITHUB_WORKSPACE}/Docker-DocumentServer/documentserver-compiled"

          # Inject single-layer BuildKit bind-mount overlay directly into the official Dockerfile's RUN step
          # so /var/www/onlyoffice/documentserver is stored only ONCE in the final image (saving ~1.6 GB).
          python3 - << 'EOF'
          import sys

          dockerfile_path = "Docker-DocumentServer/Dockerfile"
          with open(dockerfile_path, "r", encoding="utf-8") as f:
              df = f.read()

          target_run = 'RUN PACKAGE_FILE='
          replacement_run = 'RUN --mount=type=bind,source=documentserver-compiled,target=/tmp/documentserver-compiled \\\n    PACKAGE_FILE='
          target_cleanup = 'rm -rf /tmp/$PACKAGE_FILE /var/log/$COMPANY_NAME /var/lib/apt/lists/*'
          replacement_cleanup = (
              'cp -a /tmp/documentserver-compiled/. /var/www/$COMPANY_NAME/documentserver/ && \\\n'
              '    chown -R ds:ds /var/www/$COMPANY_NAME/documentserver && \\\n'
              '    chmod +x /var/www/$COMPANY_NAME/documentserver/server/FileConverter/bin/x2t \\\n'
              '             /var/www/$COMPANY_NAME/documentserver/server/tools/allfontsgen \\\n'
              '             /var/www/$COMPANY_NAME/documentserver/server/tools/allthemesgen && \\\n'
              '    for bin in /var/www/$COMPANY_NAME/documentserver/server/DocService/docservice \\\n'
              '               /var/www/$COMPANY_NAME/documentserver/server/FileConverter/converter; do \\\n'
              '      out=$(NODE_ENV=production NODE_CONFIG_DIR=/etc/$COMPANY_NAME/documentserver timeout 5s "$bin" 2>&1 || true); \\\n'
              '      if echo "$out" | grep -q "MODULE_NOT_FOUND"; then \\\n'
              '        echo "FATAL: $bin failed with MODULE_NOT_FOUND:" >&2; echo "$out" >&2; exit 1; \\\n'
              '      fi; \\\n'
              '    done && \\\n'
              '    rm -rf /tmp/$PACKAGE_FILE /var/log/$COMPANY_NAME /var/lib/apt/lists/*'
          )

          if target_run not in df or target_cleanup not in df:
              print("ERROR: Expected RUN targets not found in Docker-DocumentServer/Dockerfile", file=sys.stderr)
              sys.exit(1)

          df = df.replace(target_run, replacement_run, 1).replace(target_cleanup, replacement_cleanup, 1)
          with open(dockerfile_path, "w", encoding="utf-8") as f:
              f.write(df)
          print("=== Successfully patched Docker-DocumentServer/Dockerfile for single-layer build ===")
          print(df)
          EOF

      - name: Set up QEMU (for arm64 container packaging)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./Docker-DocumentServer
          file: ./Docker-DocumentServer/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/onlyoffice-documentserver:${{ env.ONLYOFFICE_VERSION }}-${{ matrix.arch }}

  merge-manifest:
    name: Publish Multi-Arch Manifest (${{ github.event.inputs.onlyoffice_version || 'v10.0.0.169' }})
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and Push Multi-Arch Manifest List
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE_REPO="${DOCKERHUB_USER}/onlyoffice-documentserver"
          SOURCES=()

          if docker buildx imagetools inspect --raw "${IMAGE_REPO}:${ONLYOFFICE_VERSION}" >/tmp/current-manifest.json 2>/dev/null; then
            docker buildx imagetools inspect "${IMAGE_REPO}:${ONLYOFFICE_VERSION}" >/tmp/current-inspect.txt 2>/dev/null || true
          else
            rm -f /tmp/current-manifest.json /tmp/current-inspect.txt
          fi

          for ARCH in amd64 arm64; do
            ARCH_TAG="${IMAGE_REPO}:${ONLYOFFICE_VERSION}-${ARCH}"
            if docker buildx imagetools inspect "${ARCH_TAG}" >/dev/null 2>&1; then
              SOURCES+=("${ARCH_TAG}")
            elif [ -f /tmp/current-manifest.json ]; then
              # Preserve an existing single-arch or indexed image when only the other arch was built in this run
              EXISTING_REF=$(python3 - "${IMAGE_REPO}" "${ONLYOFFICE_VERSION}" "${ARCH}" << 'PY'
          import json, sys

          repo, version, arch = sys.argv[1], sys.argv[2], sys.argv[3]
          with open("/tmp/current-manifest.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if "manifests" in data:
              for m in data["manifests"]:
                  p = m.get("platform", {})
                  if p.get("os") == "linux" and p.get("architecture") == arch:
                      print(f"{repo}@{m['digest']}")
                      sys.exit(0)
          elif __import__("os").path.isfile("/tmp/current-inspect.txt"):
              with open("/tmp/current-inspect.txt", "r", encoding="utf-8") as f:
                  if f"linux/{arch}" in f.read():
                      print(f"{repo}:{version}")
          PY
              )
              if [ -n "${EXISTING_REF}" ]; then
                echo "=== Preserving existing ${ARCH} image (${EXISTING_REF}) under ${ARCH_TAG} ==="
                docker buildx imagetools create -t "${ARCH_TAG}" "${EXISTING_REF}"
                SOURCES+=("${ARCH_TAG}")
              fi
            fi
          done

          rm -f /tmp/current-manifest.json /tmp/current-inspect.txt

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "ERROR: No architecture images found for ${IMAGE_REPO}:${ONLYOFFICE_VERSION}" >&2
            exit 1
          fi

          echo "=== Publishing multi-arch manifest list from: ${SOURCES[*]} ==="
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${ONLYOFFICE_VERSION}" \
            -t "${IMAGE_REPO}:latest" \
            "${SOURCES[@]}"

          echo "=== Final Manifest ==="
          docker buildx imagetools inspect "${IMAGE_REPO}:${ONLYOFFICE_VERSION}"
